<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>tmun.ai 已發表專案儀表板</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: pink sheet — header nav, collapsible pinned dashboard, animated AI hero, tabs (Timeline / 所有公開頁面 / 盤點表), platform sections, footer */
:root{
  --bg:#fff0f5; --bg-2:#ffe3ee; --surface:#ffffff; --surface-2:#fff7fa;
  --ink:#4a1f36; --ink-soft:#8a5a72; --line:#f6cfdf;
  --rose:#e0507f; --rose-deep:#b8325f; --blush:#f8a9c6; --lilac:#b89ae8; --gold:#e3a645; --mint:#3fb59a;
  --on-accent:#ffffff;
  --glow1:#ffd6e6; --glow2:#fde7f0;
  --hero-a:#fff7fa; --hero-b:#ffe4ef; --hero-c:#f3e6ff;
  --capsule:rgba(255,255,255,.6);
  --tint-rose:#ffe0ec; --tint-grey:#f1eef3; --fg-grey:#6e6475;
  --teach-bg:#e6f6f1; --teach-fg:#20765f;
  --research-bg:#efe7fd; --research-fg:#6a45b8;
  --both-bg:#ffe9d6; --both-fg:#99530f;
  --warn-bg:#fff6e4; --warn-line:#f3d79c; --warn-fg:#8a5a0e;
  --shadow:rgba(184,50,95,.35);
  --font-display:"Fraunces","Noto Serif TC",Georgia,serif;
  --font-body:"Inter","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --radius:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1d0e18; --bg-2:#2c1626; --surface:#251320; --surface-2:#2e1828;
  --ink:#fbe7f0; --ink-soft:#c99db4; --line:#4a2a3d;
  --rose:#ff6f9e; --rose-deep:#ff9cbf; --blush:#c76a90; --lilac:#b79cf0; --gold:#f0b95c; --mint:#5cc9ad;
  --on-accent:#2a0c1c;
  --glow1:#3a1530; --glow2:#2a1124;
  --hero-a:#2a1222; --hero-b:#351530; --hero-c:#2a1838;
  --capsule:rgba(255,255,255,.06);
  --tint-rose:#4a1d33; --tint-grey:#332833; --fg-grey:#c5b6c4;
  --teach-bg:#173a31; --teach-fg:#8be0c6;
  --research-bg:#2e2350; --research-fg:#c9b4ff;
  --both-bg:#43291a; --both-fg:#ffc08a;
  --warn-bg:#3a2a12; --warn-line:#6d5121; --warn-fg:#ffd58a;
  --shadow:rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1d0e18; --bg-2:#2c1626; --surface:#251320; --surface-2:#2e1828;
  --ink:#fbe7f0; --ink-soft:#c99db4; --line:#4a2a3d;
  --rose:#ff6f9e; --rose-deep:#ff9cbf; --blush:#c76a90; --lilac:#b79cf0; --gold:#f0b95c; --mint:#5cc9ad;
  --on-accent:#2a0c1c;
  --glow1:#3a1530; --glow2:#2a1124;
  --hero-a:#2a1222; --hero-b:#351530; --hero-c:#2a1838;
  --capsule:rgba(255,255,255,.06);
  --tint-rose:#4a1d33; --tint-grey:#332833; --fg-grey:#c5b6c4;
  --teach-bg:#173a31; --teach-fg:#8be0c6;
  --research-bg:#2e2350; --research-fg:#c9b4ff;
  --both-bg:#43291a; --both-fg:#ffc08a;
  --warn-bg:#3a2a12; --warn-line:#6d5121; --warn-fg:#ffd58a;
  --shadow:rgba(0,0,0,.6);
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;
  background-image:radial-gradient(1200px 500px at 85% -10%,var(--glow1) 0%,transparent 60%),radial-gradient(900px 400px at -10% 30%,var(--glow2) 0%,transparent 60%)}
.wrap{width:100%;max-width:none;margin:0;padding-left:max(clamp(12px,2.5vw,40px),env(safe-area-inset-left,0px));padding-right:max(clamp(12px,2.5vw,40px),env(safe-area-inset-right,0px))}
a{color:var(--rose-deep)}
:focus-visible{outline:3px solid var(--rose);outline-offset:2px;border-radius:6px}
button{font-family:inherit}

/* Header */
.topbar{height:4px;background:linear-gradient(90deg,var(--rose),var(--blush),var(--lilac))}
header.site{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;border-bottom:1px solid var(--line);position:relative}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:22px;text-decoration:none;color:var(--ink)}
.mark{width:34px;height:34px;display:grid;place-items:center;color:#fff;font:800 13px var(--font-body);background:linear-gradient(135deg,#e0507f,#b89ae8);clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%)}
.brand small{display:block;font:500 10.5px var(--font-mono);color:var(--ink-soft);letter-spacing:1px;margin-top:-4px}
.navside{display:flex;align-items:center;gap:6px}
nav.main{display:flex;gap:2px}
nav.main a{padding:6px 12px;border-radius:999px;text-decoration:none;color:var(--ink);font-weight:500;white-space:nowrap}
nav.main a:hover{background:var(--bg-2)}
nav.main a small{font:500 10px var(--font-mono);color:var(--ink-soft)}
.iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:grid;place-items:center;font-size:17px}
.iconbtn:hover{border-color:var(--rose)}
.signin{background:var(--ink)!important;color:var(--bg)!important}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 40px -20px var(--shadow);padding:8px;min-width:230px;display:flex;flex-direction:column}
.menu a{padding:9px 12px;border-radius:10px;text-decoration:none;color:var(--ink);font-weight:500}
.menu a:hover{background:var(--bg-2)}
.menu .sep{height:1px;background:var(--line);margin:6px 4px}
.menu .only-narrow{display:none}

/* Dashboard title */
.titlerow{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-block:26px 16px;border-bottom:1px solid var(--line)}
.eyebrow{font:700 12px var(--font-mono);letter-spacing:3px;color:var(--rose-deep)}
h1{margin:6px 0 0;font-size:clamp(28px,4.6vw,48px);line-height:1.15;font-weight:900;text-wrap:balance}
h1 .en{font-family:var(--font-display);font-weight:800}
h1 .zh{color:var(--rose)}
.meta{display:flex;flex-direction:column;align-items:flex-end;gap:8px;font-size:13px;color:var(--ink-soft)}
.meta-top{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;border:1px solid var(--gold);color:var(--warn-fg);font-weight:700;font-size:12px;background:var(--surface)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}
.collapse-btn{border:1px solid var(--ink);background:var(--surface);color:var(--ink);font-weight:700;font-size:13px;padding:4px 14px;border-radius:999px;cursor:pointer}
.meta b{color:var(--ink)}

/* Hero */
.hero{margin-block:20px;border-radius:28px;overflow:hidden;background:linear-gradient(160deg,var(--hero-a) 0%,var(--hero-b) 45%,var(--hero-c) 100%);border:1px solid var(--line);box-shadow:0 20px 50px -30px var(--shadow)}
.hero-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:8px;padding:28px 28px 0}
.hero-copy{align-self:center;min-width:0}
.kicker{font:700 12px var(--font-mono);letter-spacing:3px;color:var(--rose-deep)}
.hero-copy h2{font-size:clamp(30px,4.4vw,52px);line-height:1.12;margin:10px 0 8px;font-weight:900;text-wrap:balance}
.hero-copy h2 span{background:linear-gradient(90deg,var(--rose),#c06bd8);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-copy p{margin:0;color:var(--ink-soft);max-width:34em}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.tag{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;color:#fff;border:0;cursor:pointer}
.arc-box{min-width:0}
.arc-box svg{width:100%;height:auto;display:block}
.arc-label{font:700 13px var(--font-body);fill:var(--ink)}
.arc-code{font:500 9px var(--font-mono);fill:var(--rose-deep);letter-spacing:1.5px}
.spin{transform-origin:400px 300px;animation:spin 40s linear infinite}
.spin.rev{animation-duration:60s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.hex-glow{animation:glow 2.4s ease-in-out infinite;transform-origin:400px 300px}
@keyframes glow{50%{transform:scale(1.06);opacity:.55}}
.spoke{stroke-dasharray:4 8;animation:flow 1.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
.node-pulse{animation:np 2.2s ease-in-out infinite}
@keyframes np{50%{r:9;opacity:.35}}
.band{padding:6px 28px 22px}
.band canvas{width:100%;height:150px;display:block}
.band-labels{display:flex;justify-content:space-between;gap:8px;font:700 11px var(--font-mono);letter-spacing:2.5px;color:var(--rose-deep)}
.band-labels span:nth-child(2){color:var(--ink-soft)}

/* Controls */
.unitrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:4px 0 16px;font-size:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;font:700 13px var(--font-body);color:var(--ink-soft);padding:5px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--rose);color:var(--on-accent)}
.muted{color:var(--ink-soft)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi h3{margin:0;font-size:14px;font-weight:700;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.kpi .num{font:800 46px/1.05 var(--font-display);color:var(--rose);font-variant-numeric:tabular-nums;margin-top:6px}
.kpi .num small{font:700 14px var(--font-body);color:var(--ink)}
.kpi .sub{font-size:12.5px;color:var(--ink-soft)}
.kpi .sub b{color:var(--ink)}
.kpi.dashed{border-style:dashed}
.kpi.warn{border-color:var(--gold);background:linear-gradient(180deg,var(--surface),var(--warn-bg))}
.kpi.warn .num{color:var(--gold)}
.chip{font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--bg-2);color:var(--rose-deep)}
.kpi.warn .chip{background:var(--warn-bg);color:var(--warn-fg);border:1px solid var(--warn-line)}
.kpi .link{margin-top:auto;padding:8px 0 0;border:0;border-top:1px dashed var(--line);font-size:12.5px;font-weight:700;color:var(--rose-deep);background:none;text-align:left;cursor:pointer}
.kpi.warn .link{color:var(--warn-fg)}
.coverage{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 22px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:center}
.coverage h3{margin:0 0 6px;font-size:15px;letter-spacing:2px;color:var(--rose-deep)}
.coverage p{margin:0}
.bar{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--bg-2);gap:2px}
.bar i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12.5px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* Tabs */
.tabs{display:flex;gap:4px;margin-top:28px;border-bottom:2px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;font:700 16px var(--font-body);color:var(--ink-soft);padding:12px 18px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--rose)}
.datebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-block:14px 0;font-size:14px}
.datebar input,.filters input,.filters select{font:500 14px var(--font-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px;max-width:100%}
.panel{padding-block:16px 10px}

/* Inventory */
.inv-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.inv-head h2,.sec h2{margin:0;font-size:22px}
.inv-head p{margin:2px 0 0;font-size:13px}
.notice{display:flex;gap:10px;align-items:flex-start;background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-fg);border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:12px}
.notice code{font-family:var(--font-mono)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters input{width:220px}
.btn{font:700 13px var(--font-body);border-radius:10px;padding:8px 14px;cursor:pointer;border:1px solid var(--rose);background:var(--surface);color:var(--rose-deep)}
.table-scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
table{border-collapse:collapse;width:100%;min-width:1040px;font-size:14px}
th,td{padding:11px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:var(--bg-2);font-size:13px;color:var(--rose-deep);white-space:nowrap}
tbody tr:hover{background:var(--surface-2)}
td .name{font-weight:700}
.no{font:500 11px var(--font-mono);color:var(--ink-soft)}
.ai-yes,.ai-no{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.ai-yes{background:var(--tint-rose);color:var(--rose-deep)}
.ai-yes::before{content:"";width:7px;height:7px;background:var(--rose);clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%)}
.ai-no{background:var(--tint-grey);color:var(--fg-grey)}
.use{display:inline-block;padding:2px 10px;border-radius:6px;font-size:12px;font-weight:700;white-space:nowrap}
.use.teach{background:var(--teach-bg);color:var(--teach-fg)}
.use.research{background:var(--research-bg);color:var(--research-fg)}
.use.both{background:var(--both-bg);color:var(--both-fg)}
.use.todo{background:var(--warn-bg);color:var(--warn-fg)}
td a,.card a.url{font:500 12.5px var(--font-mono);word-break:break-all}
.aud{display:flex;flex-wrap:wrap;gap:4px}
.aud span{font-size:12px;padding:1px 8px;border:1px solid var(--line);border-radius:999px;white-space:nowrap}
.cat{font-size:12px;font-weight:700;white-space:nowrap}
.empty{padding:28px;text-align:center;color:var(--ink-soft)}
.copy-out{width:100%;margin-top:10px;font:12px var(--font-mono);min-height:120px;border-radius:10px;border:1px solid var(--line);padding:10px;background:var(--surface);color:var(--ink)}

/* Timeline */
.tl{list-style:none;margin:0;padding:0 0 0 22px;border-left:2px solid var(--blush);display:flex;flex-direction:column;gap:14px}
.tl li{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;align-items:center}
.tl li::before{content:"";position:absolute;left:-31px;top:20px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--rose)}
.tl time{font:500 12px var(--font-mono);color:var(--rose-deep)}
.tl h4{margin:2px 0;font-size:16px}
.tl .info{font-size:13px;color:var(--ink-soft)}
.thumb{width:100%;aspect-ratio:16/10;border-radius:10px;display:block;max-width:100%}
/* Cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.card .thumb{border-radius:0}
.card .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h4{margin:0;font-size:16px}
.card .by{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--ink-soft)}
.card .views{font:500 12px var(--font-mono);color:var(--rose-deep);white-space:nowrap}
.card .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:6px}

/* Platform sections */
.sec{margin-top:40px;padding-top:26px;border-top:1px solid var(--line);scroll-margin-top:16px}
.sec > p{margin:4px 0 16px;color:var(--ink-soft);max-width:60em}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;min-width:0}
.box h3{margin:0 0 10px;font-size:16px}
.deflist{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;margin:0;font-size:14px}
.deflist dt{font-weight:700;color:var(--rose-deep);white-space:nowrap}
.deflist dd{margin:0;color:var(--ink)}
.cats{display:flex;flex-direction:column;gap:10px}
.cats .c{display:grid;grid-template-columns:150px minmax(0,1fr) 36px;gap:10px;align-items:center;font-size:14px}
.cats .c .t{font-weight:700}
.cats .meter{height:10px;border-radius:999px;background:var(--bg-2);overflow:hidden}
.cats .meter i{display:block;height:100%;border-radius:999px}
.cats .c .n{font:500 13px var(--font-mono);text-align:right}
.cats .c .ex{grid-column:1/-1;margin-top:-6px;font-size:12.5px;color:var(--ink-soft)}
.feat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.feat .box h3{display:flex;gap:8px;align-items:center;font-size:15px;margin-bottom:4px}
.feat .box p{margin:0;font-size:13px;color:var(--ink-soft)}
.ico{width:28px;height:28px;flex:none;display:grid;place-items:center;border-radius:8px;background:var(--tint-rose);color:var(--rose-deep);font:800 12px var(--font-mono)}
.policy{margin-top:14px;font-size:13.5px;background:var(--surface);border:1px dashed var(--rose);border-radius:12px;padding:10px 14px}
.store{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.store ul{margin:0;padding-left:18px;font-size:13.5px}
.store .box h3{font-size:15px}
.store .box h3 small{display:block;font:500 10px var(--font-mono);color:var(--ink-soft);letter-spacing:1.5px}

/* Modal */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(30,10,22,.45);display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);color:var(--ink);border-radius:20px;border:1px solid var(--line);max-width:400px;width:100%;padding:22px}
.modal h3{margin:0 0 6px}
.modal label{display:block;font-size:13px;margin-top:12px;font-weight:700}
.modal input{width:100%;font:500 14px var(--font-body);padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.btn.solid{background:var(--rose);color:var(--on-accent)}
.modal .msg{font-size:13px;color:var(--rose-deep);margin-top:10px}

footer{margin-top:40px;border-top:1px solid var(--line);padding-block:22px 40px;font-size:13px;color:var(--ink-soft);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer nav{display:flex;gap:16px;flex-wrap:wrap}
footer a{color:var(--ink);text-decoration:none;font-weight:500}
footer a:hover{color:var(--rose-deep)}

@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.feat{grid-template-columns:repeat(2,minmax(0,1fr))}.store{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:860px){
  nav.main{display:none}
  .menu .only-narrow{display:block}
  .hero-grid{grid-template-columns:1fr;padding:22px 18px 0}
  .band{padding:6px 18px 18px}
  .coverage,.grid2{grid-template-columns:1fr}
  .meta{align-items:flex-start}.meta-top{justify-content:flex-start}
  .store{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:520px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}

function renderTable(){

function setRange(kind){
  document.querySelectorAll("[data-range]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.range===kind));
  if(kind==="all") range={from:"",to:""};
  else if(kind==="month") range={from:MONTH+"-01",to:TODAY};
  else range={from:addDays(TODAY,-(+kind)+1),to:TODAY};
  $("#dFrom").value=range.from; $("#dTo").value=range.to; refresh();
}

(function arcNodes(){
  const SHORT={"醫學教育與臨床訓練":"醫學教育","互動學習與遊戲":"互動遊戲"};
  const topics=Object.keys(CATS).slice(0,7), cx=400, cy=420, r=310, NS="http://www.w3.org/2000/svg";
  const spokes=document.getElementById("spokes"), nodes=document.getElementById("nodes");
  topics.forEach((label,i)=>{
    const ang=Math.PI-(Math.PI*(i+0.5)/topics.length), x=cx+r*Math.cos(ang), y=cy-r*Math.sin(ang);
    const l=document.createElementNS(NS,"line");
    Object.entries({x1:x,y1:y,x2:400,y2:300,stroke:"#e0507f","stroke-opacity":".45","stroke-width":"1.5",class:"spoke"}).forEach(([k,v])=>l.setAttribute(k,v));
    l.style.animationDelay=(-i*0.2)+"s"; spokes.appendChild(l);
    const left=x<cx-20, right=x>cx+20, lx=x+(left?-14:right?14:0), anchor=left?"end":right?"start":"middle", ly=y-(Math.abs(x-cx)<60?24:8);
    const g=document.createElementNS(NS,"g");
    g.innerHTML=`<circle class="node-pulse" cx="${x}" cy="${y}" r="7" fill="${CATS[label]}" style="animation-delay:${-i*0.3}s"/>
      <circle cx="${x}" cy="${y}" r="6" fill="#fff" stroke="${CATS[label]}" stroke-width="3"/>
      <text x="${lx}" y="${ly-14}" text-anchor="${anchor}" class="arc-code">TRACK ${String.fromCharCode(65+i)}</text>
      <text x="${lx}" y="${ly}" text-anchor="${anchor}" class="arc-label">${SHORT[label]||label}</text>`;
    nodes.appendChild(g);
  });
})();

/* ---------- metrics ---------- */
let unit="work";
function median(a){const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length?(s.length%2?s[m]:Math.round((s[m-1]+s[m])/2)):0;}
function countUp(el,to){ if(reduce){el.textContent=to.toLocaleString("en-US");return;} const t0=performance.now(),d=900;
  (function step(t){const p=Math.min(1,(t-t0)/d);el.textContent=Math.round(to*(1-Math.pow(1-p,3))).toLocaleString("en-US");if(p<1)requestAnimationFrame(step);})(t0);}
function renderKpis(){

  countUp($("#kAuthors"), authors.length);
  $("#kAuthorsSub").innerHTML=`Average <b>${(PROJECTS.length/authors.length).toFixed(1)}</b> projects each`;
  countUp($("#kNew"), PROJECTS.filter(p=>p.date.startsWith(MONTH)).length);

(function arcNodes(){
  const topics=Object.keys(CATS).slice(0,7), cx=400, cy=420, r=310, NS="http://www.w3.org/2000/svg";
  const spokes=document.getElementById("spokes"), nodes=document.getElementById("nodes");
  topics.forEach((label,i)=>{
    const ang=Math.PI-(Math.PI*(i+0.5)/topics.length), x=cx+r*Math.cos(ang), y=cy-r*Math.sin(ang);
    const l=document.createElementNS(NS,"line");
    Object.entries({x1:x,y1:y,x2:400,y2:300,stroke:"#e0507f","stroke-opacity":".45","stroke-width":"1.5",class:"spoke"}).forEach(([k,v])=>l.setAttribute(k,v));
    l.style.animationDelay=(-i*0.2)+"s"; spokes.appendChild(l);
    const left=x<cx-20, right=x>cx+20, lx=x+(left?-14:right?14:0), anchor=left?"end":right?"start":"middle", ly=y-(Math.abs(x-cx)<60?24:8);
    const g=document.createElementNS(NS,"g");
    g.innerHTML=`<circle class="node-pulse" cx="${x}" cy="${y}" r="7" fill="${CATS[label]}" style="animation-delay:${-i*0.3}s"/>
      <circle cx="${x}" cy="${y}" r="6" fill="#fff" stroke="${CATS[label]}" stroke-width="3"/>
      <text x="${lx}" y="${ly-14}" text-anchor="${anchor}" class="arc-code">TRACK ${String.fromCharCode(65+i)}</text>
      <text x="${lx}" y="${ly}" text-anchor="${anchor}" class="arc-label">${SHORT[label]||label}</text>`;
    nodes.appendChild(g);
  });
})();

/* ---------- DNA → particles → AI → ECG → heart animation ---------- */
(function band(){

  const parts=[]; for(let i=0;i<70;i++) parts.push({x:Math.random(),y:Math.random(),s:2+Math.random()*5,v:.0006+Math.random()*.0012,c:colors[i%colors.length]});

    if(!W){ resize(); }
    const t=ms/1000; ctx.clearRect(0,0,W,H);

    rr(4,mid-H*.36,W-8,H*.72,H*.36); ctx.fillStyle=cs.getPropertyValue("--capsule").trim()||"rgba(255,255,255,.6)"; ctx.fill(); ctx.strokeStyle="rgba(224,80,127,.25)"; ctx.lineWidth=1; ctx.stroke();
    const xD0=W*.03, xD1=W*.36, xP1=W*.56, xAI=W*.62, xE1=W*.92, xH=W*.955, k=2*Math.PI/Math.max(90,W*.09);
    for(let x=xD0+6;x<xD1;x+=Math.max(10,W*.012)){const ph=x*k-t*2.2, f=x>xD1-W*.06?(xD1-x)/(W*.06):1;
      ctx.strokeStyle=`rgba(184,154,232,${.55*f})`;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,mid+Math.sin(ph)*amp);ctx.lineTo(x,mid-Math.sin(ph)*amp);ctx.stroke();}

      for(let x=xD0+6;x<=xD1;x+=2){const y=mid+Math.sin(x*k-t*2.2+off)*amp*(x>xD1-W*.05?(xD1-x)/(W*.05)*.7+.3:1); x===xD0+6?ctx.moveTo(x,y):ctx.lineTo(x,y);} ctx.stroke();});
    parts.forEach(p=>{ if(!reduce){p.x+=p.v; if(p.x>1){p.x=0;p.y=Math.random();}}
      const x=xD1-W*.04+p.x*(xAI-xD1-W*.01), y=mid+(p.y-.5)*2*((1-p.x)*amp*1.5+4);
      ctx.globalAlpha=p.x<.1?p.x*10:p.x>.85?(1-p.x)/.15:1; ctx.fillStyle=p.c; const s=p.s*(1-p.x*.6); ctx.fillRect(x-s/2,y-s/2,s,s);});
    ctx.globalAlpha=1;

    rr(-sz/2,-sz/2,sz,sz,sz*.18); const cg=ctx.createLinearGradient(-sz/2,-sz/2,sz/2,sz/2); cg.addColorStop(0,"#5a1d3e"); cg.addColorStop(1,"#3b1236"); ctx.fillStyle=cg; ctx.fill();
    ctx.shadowBlur=0; ctx.lineWidth=2.5; ctx.strokeStyle="#f8a9c6"; ctx.stroke();

const TRACK=(function(){
  let m={}; try{m=JSON.parse(localStorage.getItem("tmun-track")||"{}")||{}}catch(e){}
  return {get m(){return m}, add(k){m[k]=(m[k]||0)+1; try{localStorage.setItem("tmun-track",JSON.stringify(m))}catch(e){}}, clear(){m={}; try{localStorage.removeItem("tmun-track")}catch(e){}}};
})();
document.addEventListener("click",e=>{
  const el=e.target.closest("button,a,input,select,[role=tab]");
  if(!el || el.closest("#adminView") || el.closest("#signinBox")) return;
  let k = el.id ? "#"+el.id : el.dataset.range ? `[data-range=${el.dataset.range}]` : el.dataset.cat ? "[data-cat]" : el.closest("td,.card,.tl") ? "a.project-link" : el.tagName==="A" ? "a[href]" : null;
  if(k) TRACK.add(k);
}, true);

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function adminMetrics(P){
  const r=mulberry32(20261122);
  const rows=P.map((p,i)=>{const ai=p.ai==="有"||p.ai==="Yes";
    const imp=Math.round(p.views*(2.6+r()*4.2)), read=Math.min(92,Math.round(36+r()*44+(ai?6:0))),
      dwell=Math.round(40+r()*150+(ai?55:0)), inter=Math.min(p.views,Math.round(p.views*(0.08+r()*0.42+(ai?0.12:0))));
    return {p,i,ai,imp,clicks:p.views,ctr:p.views/imp,read,dwell,inter,ir:inter/p.views};});
  const mx=k=>Math.max(...rows.map(x=>x[k]));
  const M={ctr:mx("ctr"),dwell:mx("dwell"),ir:mx("ir"),read:mx("read")};
  rows.forEach(x=>{x.score=Math.round(100*(.3*x.ctr/M.ctr+.25*x.dwell/M.dwell+.3*x.ir/M.ir+.15*x.read/M.read));
    x.why=["ctr","dwell","ir","read"].filter(k=>x[k]/M[k]>=.8);});
  return rows;
}
const fmtS=s=>`${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,"0")}`;
const pct=(v,d=1)=>(v*100).toFixed(d)+"%";
const nf=n=>n.toLocaleString("en-US");
const escA=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function hbars(items,max,opts={}){
  return items.map(it=>`<div class="hb"><span class="l">${escA(it.l)}</span><span class="t"><i class="${it.cls||opts.cls||""}" style="width:${Math.max(1.5,it.v/max*100)}%"></i>${opts.avg!=null?`<span class="avg" style="left:${opts.avg/max*100}%"></span>`:""}</span><span class="v">${it.vt}${it.sub?`<small>${it.sub}</small>`:""}</span></div>`).join("");
}
function trendSVG(total,T){
  const r=mulberry32(77), days=30, base=total/38, pts=[];
  for(let d=0;d<days;d++){const dt=new Date("2026-10-24T00:00:00");dt.setDate(dt.getDate()+d);
    const wk=[.72,1.05,1.12,1.08,1.02,.95,.68][dt.getDay()], grow=.8+d/days*.45;
    pts.push({d:dt.toISOString().slice(5,10),v:Math.round(base*wk*grow*(.85+r()*.3))});}
  const avg=pts.map((p,i)=>{const s=pts.slice(Math.max(0,i-6),i+1);return s.reduce((a,b)=>a+b.v,0)/s.length;});
  const W=720,H=220,L=44,R=46,Tp=14,B=28, maxV=Math.ceil(Math.max(...pts.map(p=>p.v))/40)*40;
  const x=i=>L+i*(W-L-R)/(days-1), y=v=>Tp+(1-v/maxV)*(H-Tp-B);
  const ticks=[0,maxV/4,maxV/2,maxV*3/4,maxV];
  const line=pts.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join("");
  const area=line+`L${x(days-1)},${y(0)}L${x(0)},${y(0)}Z`;
  const ln2=avg.map((v,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  const last=pts[days-1];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${escA(T.trend)}">
    <g class="grid">${ticks.map(t=>`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}"/><text class="ax" x="${L-8}" y="${y(t)+3}" text-anchor="end">${nf(t)}</text>`).join("")}</g>
    ${[0,7,14,21,29].map(i=>`<text class="ax" x="${x(i)}" y="${H-8}" text-anchor="middle">${pts[i].d}</text>`).join("")}
    <path class="area" d="${area}"/><path class="ln2" d="${ln2}"/><path class="ln" d="${line}"/>
    <circle class="end" cx="${x(days-1)}" cy="${y(last.v)}" r="5"/><text class="endlbl" x="${x(days-1)+8}" y="${y(last.v)+4}">${last.v}</text></svg>`;
}

  /* 6 ids */
  const idCounts=[["a.project-link",2214,1170],["#tab-pages",1284,812],["#tab-inventory",967,655],["#q",702,498],["#tab-timeline",541,402],["[data-range=month]",433,351],["#fCat",388,290],["#menuBtn",345,290],["#fAI",301,247],["#langBtn",274,233],["#fUse",214,180],["#themeBtn",198,170],["#copyCsv",156,121],["#collapseBtn",122,101],["[data-range=7]",118,96],["#jumpTodo",64,52],["#jumpMonth",58,49],["[data-cat]",41,37]];
  const idTotal=idCounts.reduce((a,x)=>a+x[1],0);
  const rr=mulberry32(5), pages=["timeline","pages","inventory"];
  const recent=Array.from({length:8},(_,i)=>{const id=idCounts[Math.floor(rr()*10)][0];return [`11-22 ${String(14-Math.floor(i/3)).padStart(2,"0")}:${String(58-i*7).padStart(2,"0")}`,"S-"+Math.floor(4096+rr()*61439).toString(16).toUpperCase(),id,T.page[pages[Math.floor(rr()*3)]]];});

  av.innerHTML=`
  <div class="adm-head">
    <div><div class="eyebrow">${T.eyebrow}</div><h1><span class="en">tmun.ai</span> <span class="zh">${T.title}</span></h1><div class="muted" style="font-size:13px;margin-top:4px">${T.period}</div></div>
    <div class="adm-actions"><span class="pill"><span class="dot"></span>${T.sample}</span><button class="collapse-btn" type="button" id="admBack">${T.back}</button></div>
  </div>
  <div class="adm-note">⚠︎ <span>${T.note}</span></div>
  <section class="adm-kpis">${[nf(imp),nf(clicks),pct(avgCtr),pct(avgRead),fmtS(avgDwell),pct(avgIR)].map((v,i)=>`<div class="adm-kpi"><div class="k">${T.k[i]}</div><div class="v">${v}</div><div class="s">${T.ks[i]}</div></div>`).join("")}</section>
  <div class="adm-grid">
    <section class="pa wide trend"><h3>${T.trend}</h3><p class="desc">${T.trendD}</p>${trendSVG(clicks,T)}</section>

    <section class="pa"><h3><span class="n">01</span>${T.t1}</h3><p class="desc">${T.d1}</p>
      ${hbars(byCtr.map(x=>({l:x.p.name,v:x.ctr,vt:pct(x.ctr),sub:`${nf(x.clicks)}/${nf(x.imp)}`})),ctrMax,{avg:avgCtr})}
      <div class="foot">${lang==="zh"?"全站平均點擊率":"Site average CTR"} <b>${pct(avgCtr)}</b></div></section>

      ${T.secs.map((s,i)=>hbars([{l:s[0],v:secData[i][0],vt:secData[i][0]+T.sec}],100)+hbars([{l:"",v:secData[i][1],vt:secData[i][1]+"%",cls:"lilac"}],100)).join("")}

      ${hbars(cats.map(c=>({l:c.c,v:c.ir,vt:pct(c.ir),cls:"lilac"})),Math.ceil(cats[0].ir*10)/10,{avg:avgIR})}</section>

    <section class="pa wide"><h3><span class="n">06</span>${T.t6}</h3><p class="desc">${T.d6}</p>

function parseCSV(t){const rows=[];let row=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
  else if(c==='"')q=true; else if(c===','){row.push(f);f="";} else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f="";} else f+=c;}
  if(f||row.length){row.push(f);rows.push(row);} return rows.filter(r=>r.some(x=>x.trim()));}
function gamesFromCSV(text){
  const rows=parseCSV(text); if(rows.length<2) return [];
  const h=rows[0].map(x=>x.trim().toLowerCase());
  const col=keys=>h.findIndex(x=>keys.some(k=>x.includes(k)));
  const ci={t:col(["遊戲名稱","名稱","title","game"]),a:col(["作者","姓名","author","name"]),c:col(["班級","class"]),d:col(["簡介","說明","description","desc"]),u:col(["連結","網址","link","url","檔案","file"]),ok:col(["審核","approved","顯示"])};
  return rows.slice(1)
    .map((r,n)=>({t:r[ci.t]||"",a:r[ci.a]||"",c:ci.c>=0?r[ci.c]||"":"",d:ci.d>=0?r[ci.d]||"":"",u:(ci.u>=0?r[ci.u]||"":"").split(/[\s,]+/)[0],sample:false,n,id:gameId((r[0]||"")+"|"+(r[ci.t]||"")+"|"+(r[ci.a]||""))})).filter(g=>g.t.trim()).reverse();
}
function gameId(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return "g"+(h>>>0).toString(36);}

const TRAFFIC_TXT = {

const twDay=(offset=0)=>new Date(Date.now()+8*3600e3-offset*86400e3).toISOString().slice(0,10);
let TRAFFIC=null, TRAFFIC_STATE="idle";
function loadTraffic(cb){
  const url=safeUrl(GAME_CONFIG.statsUrl); if(!url){TRAFFIC_STATE="off";cb();return;}
  if(TRAFFIC_STATE==="ok"||TRAFFIC_STATE==="loading"){ if(TRAFFIC_STATE==="ok") cb(); return; }
  TRAFFIC_STATE="loading";
  const key="site-"+twDay().replace(/-/g,""); let counted=false;
  try{counted=localStorage.getItem("tmun-visit")===key}catch(e){}
  const q=url+(url.includes("?")?"&":"?")+(counted?"a=get":"a=view&ids="+key);
  fetch(q).then(r=>{if(!r.ok)throw 0;return r.json();}).then(j=>{TRAFFIC=j||{};TRAFFIC_STATE="ok";try{localStorage.setItem("tmun-visit",key)}catch(e){} cb();})
    .catch(()=>{TRAFFIC_STATE="err";cb();});
}
function trafficLine(pts,label){
  const W=900,H=220,L=40,R=24,Tp=26,B=30, n=pts.length;
  const step=Math.max(4,Math.ceil(Math.max(...pts.map(p=>p.v))/4)), maxV=step*4;
  const x=i=>L+i*(W-L-R)/(n-1), y=v=>Tp+(1-v/maxV)*(H-Tp-B);
  const P=pts.map((p,i)=>[x(i),y(p.v)]);
  let d=`M${P[0][0].toFixed(1)},${P[0][1].toFixed(1)}`;
  for(let i=0;i<n-1;i++){const p0=P[Math.max(0,i-1)],p1=P[i],p2=P[i+1],p3=P[Math.min(n-1,i+2)];
    const lo=Math.min(p1[1],p2[1]), hi=Math.max(p1[1],p2[1]), cl=v=>Math.max(lo,Math.min(hi,v));
    const c1=[p1[0]+(p2[0]-p0[0])/6, cl(p1[1]+(p2[1]-p0[1])/6)], c2=[p2[0]-(p3[0]-p1[0])/6, cl(p2[1]-(p3[1]-p1[1])/6)];
    d+=`C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;}
  const area=d+`L${P[n-1][0].toFixed(1)},${y(0)}L${P[0][0].toFixed(1)},${y(0)}Z`;
  const ticks=[0,1,2,3,4].map(k=>k*step);
  return `<svg class="tr-line" viewBox="0 0 ${W} ${H}" role="img" aria-label="${label}">
    <defs><linearGradient id="trFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0507f" stop-opacity=".32"/><stop offset="1" stop-color="#e0507f" stop-opacity="0"/></linearGradient></defs>
    ${ticks.map(t=>`<line class="g" x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}"/><text class="ax" x="${L-8}" y="${y(t)+3.5}" text-anchor="end">${t}</text>`).join("")}
    <path d="${area}" fill="url(#trFill)"/><path class="ln" d="${d}"/>
    ${pts.map((p,i)=>`<g class="pt${p.today?" today":""}"><circle cx="${P[i][0]}" cy="${P[i][1]}" r="${p.today?6:4}"/><text class="vl" x="${P[i][0]}" y="${P[i][1]-11}" text-anchor="middle">${p.v}</text><text class="ax${p.today?" now":""}" x="${P[i][0]}" y="${H-8}" text-anchor="middle">${p.d}</text></g>`).join("")}
  </svg>`;
}

  let vals=Array(7).fill("—"), subs=[...T.ks], bars=[], msg="";

  if(TRAFFIC_STATE==="ok"){

    const siteKeys=Object.keys(TRAFFIC).filter(k=>/^site-\d{8}$/.test(k)).sort();
    const total=siteKeys.reduce((a,k)=>a+(TRAFFIC[k].view||0),0);
    const today=day(twDay()), yest=day(twDay(1)), prev=day(twDay(2));
    let wk=0; for(let i=0;i<7;i++) wk+=day(twDay(i));
    const games=Object.entries(TRAFFIC).filter(([k])=>/^g[0-9a-z]+$/.test(k)&&!TRAFFIC[k].hidden);
    const gv=games.reduce((a,[,x])=>a+(x.view||0),0), gp=games.reduce((a,[,x])=>a+(x.play||0),0);
    vals=[nf(today),nf(yest),nf(wk),nf(total),nf(gv),nf(gp),gv?(gp/gv*100).toFixed(1)+"%":"0.0%"];
    subs[1]=T.vs(siteKeys.length>1?yest-prev:null)||T.ks[1];
    if(siteKeys.length){const f=siteKeys[0].slice(5);subs[3]=T.since(`${f.slice(0,4)}-${f.slice(4,6)}-${f.slice(6)}`);}
    for(let i=13;i>=0;i--){const d=twDay(i);bars.push({d:d.slice(5).replace("-","/"),v:day(d),today:i===0});}
  }
  const max=Math.max(1,...bars.map(b=>b.v));
  box.innerHTML=`<div class="tr-head"><h3>${T.title} <span class="tr-tag"><span class="dot"></span>${T.tag}</span></h3><span class="muted">${msg?e(msg):T.sub}</span></div>
    <div class="tr-grid">${T.k.map((k,i)=>`<div class="tr-kpi${i===0?" hot":""}"><div class="k">${k}</div><div class="v">${vals[i]}</div><div class="s">${e(subs[i])}</div></div>`).join("")}</div>
    ${bars.length?`<div class="tr-chart"><div class="tr-ct">${T.chart}</div>${trafficLine(bars,T.chart)}</div>`:""}`;
}

(function(){
  const TITLES={zh:"tmun.ai 已發表專案儀表板",en:"tmun.ai Project Dashboard"};
  let ctrl=null;
  const get=()=>{try{return localStorage.getItem("tmun-lang")}catch(e){return null}};
  const set=v=>{try{localStorage.setItem("tmun-lang",v)}catch(e){}};
  function mount(lang){
    if(ctrl) ctrl.abort();
    ctrl=new AbortController();
    const app=document.getElementById("app");
    app.replaceChildren(document.getElementById("tpl-"+lang).content.cloneNode(true));
    document.documentElement.lang = lang==="en" ? "en" : "zh-Hant";
    document.title=TITLES[lang];
    (lang==="en"?initEN:initZH)(ctrl.signal);
    document.getElementById("langBtn").addEventListener("click",()=>{const next=lang==="en"?"zh":"en"; set(next); mount(next); document.getElementById("langBtn").focus();});
    const wrap=app.querySelector(".wrap"), av=document.createElement("section");
    av.id="adminView"; av.hidden=true; av.setAttribute("aria-label", lang==="en"?"Admin analytics":"後台數據分析");
    wrap.querySelector("header.site").after(av);
    const setAdmin=on=>{wrap.classList.toggle("admin-mode",on); av.hidden=!on; if(on){renderAdmin(lang); window.scrollTo(0,0);}};
    renderGames(lang);
    const cov=app.querySelector("#dashBody .coverage"); if(cov){const tr=document.createElement("section"); tr.id="traffic"; tr.setAttribute("aria-label", lang==="en"?"Live site traffic":"網站即時流量"); cov.after(tr); renderTraffic(lang); loadTraffic(()=>renderTraffic(lang));}
    if(location.hash==="#games") document.getElementById("games").scrollIntoView();
    document.getElementById("siAdmin").addEventListener("click",()=>{document.getElementById("signinBox").hidden=true; location.hash="admin";});
    addEventListener("hashchange",()=>setAdmin(location.hash==="#admin"),{signal:ctrl.signal});
    setAdmin(location.hash==="#admin");
  }
  mount(get()==="en"?"en":"zh");
})();
</script>
